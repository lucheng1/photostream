name: PhotoStream
options:
  bundleIdPrefix: app.photostream
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
targets:
  PhotoStreamiOS:
    type: application
    platform: iOS
    sources:
      - path: iOSClient/Sources
      - path: Shared/Sources/PhotoStreamShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.photostream.ios
      INFOPLIST_FILE: iOSClient/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_STRICT_CONCURRENCY: complete
      CODE_SIGN_STYLE: Automatic
    info:
      path: iOSClient/Info.plist
      properties:
        CFBundleDisplayName: PhotoStream
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: PhotoStream finds your Mac Photos server on the local network.
        NSBonjourServices:
          - _photostream._tcp
    scheme:
      testTargets: []
      gatherCoverageData: false
