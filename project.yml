name: PhotoStream
options:
  bundleIdPrefix: app.photostream
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
targets:
  PhotoStreamiOS:
    type: application
    platform: iOS
    sources:
      - path: iOSClient/Sources
      - path: Shared/Sources/PhotoStreamShared
      - path: iOSClient/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.photostream.ios
      PRODUCT_NAME: PhotoStream
      INFOPLIST_FILE: iOSClient/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_STRICT_CONCURRENCY: minimal
      SWIFT_VERSION: "5.0"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOSClient/Info.plist
      properties:
        CFBundleDisplayName: PhotoStream
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: PhotoStream finds your Mac Photos server on the local network.
        NSBonjourServices:
          - _photostream._tcp
        # Only NSAllowsArbitraryLoads — pairing NSAllowsLocalNetworking with it makes
        # iOS ignore ArbitraryLoads, which blocks Tailscale 100.x cleartext HTTP.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      testTargets: []
      gatherCoverageData: false
