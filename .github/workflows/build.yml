name: PhotoStream

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mac-server:
    name: Mac Server
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build PhotoStreamServer (release)
        run: swift build --product PhotoStreamServer -c release

      - name: Package PhotoStream.app
        run: |
          set -euo pipefail
          BIN="$(find .build -name PhotoStreamServer -type f -perm -111 ! -path '*.dSYM*' | head -1)"
          test -n "$BIN"
          echo "Binary: $BIN"
          APP="dist/PhotoStream.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          cp "$BIN" "$APP/Contents/MacOS/PhotoStream"
          cp MacServer/Info.plist "$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/Resources"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          chmod +x "$APP/Contents/MacOS/PhotoStream"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" dist/PhotoStream-macOS.zip
          ls -lh dist/

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStream-macOS
          path: dist/PhotoStream-macOS.zip
          if-no-files-found: error

  ios-device:
    name: iOS Device IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone device (unsigned arm64)
        run: |
          set -euo pipefail
          xcodebuild \
            -project PhotoStream.xcodeproj \
            -scheme PhotoStreamiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products -path '*/Release-iphoneos/*.app' -type d | head -1)"
          test -n "$APP"
          echo "App: $APP"
          file "$APP"/PhotoStream* 2>/dev/null || file "$APP"/*
          lipo -info "$APP"/PhotoStream 2>/dev/null || lipo -info "$APP"/* 2>/dev/null || true
          mkdir -p dist/ipa/Payload
          cp -R "$APP" dist/ipa/Payload/
          # Ad-hoc codesign so some sideload tools accept the binary
          APP_IN_PAYLOAD="$(echo dist/ipa/Payload/*.app)"
          codesign --force --deep --sign - "$APP_IN_PAYLOAD" 2>/dev/null || true
          (
            cd dist/ipa
            zip -qry ../PhotoStream-iOS-Device.ipa Payload
          )
          ls -lh dist/PhotoStream-iOS-Device.ipa
          unzip -l dist/PhotoStream-iOS-Device.ipa | head -20

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStream-iOS-Device
          path: dist/PhotoStream-iOS-Device.ipa
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project PhotoStream.xcodeproj \
            -scheme PhotoStreamiOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package .app
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products -name '*.app' -type d | head -1)"
          test -n "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/PhotoStream-iOS-Simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStream-iOS-Simulator
          path: dist/PhotoStream-iOS-Simulator.zip
          if-no-files-found: error
